<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSAS Student Intranet</title>
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #25364a;
            background:
                linear-gradient(rgba(207, 231, 246, .18), rgba(207, 231, 246, .05)),
                url("assets/background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 20px 28px;
        }

        .brand-image {
            width: 322px;
            max-width: 78vw;
            height: 78px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .subtitle {
            margin: 0 0 20px;
            font-size: 35px;
            font-weight: 300;
            color: #2b3745;
            text-align: center;
        }

        .login-card {
            width: 374px;
            max-width: 100%;
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(64, 91, 114, .28);
            box-shadow: 0 8px 28px rgba(29, 54, 74, .26);
        }

        .card-body {
            padding: 34px 36px 26px;
        }

        .form-title {
            margin: 0 0 22px;
            padding-bottom: 9px;
            border-bottom: 1px solid #c8dbef;
            color: #3c82d7;
            font-size: 20px;
            font-weight: 300;
        }

        .field {
            position: relative;
            margin-bottom: 12px;
        }

        .field span {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        input {
            width: 100%;
            height: 34px;
            border: 1px solid #c6d2df;
            background: #eaf1fb;
            padding: 0 10px 0 31px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #ff8a3d;
            box-shadow: 0 0 0 1px #ff8a3d inset;
        }

        .message {
            display: none;
            margin-bottom: 12px;
            padding: 9px 10px;
            font-size: 13px;
        }

        .message.show { display: block; }
        .message.error { background: #fdeaea; color: #9a2626; }
        .message.success { background: #e5f6ed; color: #177345; }

        .login-row {
            display: flex;
            justify-content: flex-end;
            margin: 24px 0 18px;
        }

        button {
            min-width: 104px;
            height: 38px;
            border: 0;
            background: #448dca;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { background: #287abc; }

        .forgot {
            display: block;
            padding: 12px 14px;
            background: #4a94cf;
            color: #fff56d;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <main class="page">
        <img class="brand-image" src="assets/tarumt_logo.png" alt="TAR UMT Logo">

        <h1 class="subtitle">SSAS Student Intranet</h1>

        <section class="login-card">
            <div class="card-body">
                <h2 class="form-title">Please Enter Your Information</h2>

                <p class="message" id="loginMessage"></p>

                <form action="../server/application/loginProcess.php" method="POST">
                    <div class="field">
                        <span>👤</span>
                        <input type="email" name="email" placeholder="University email"
                               autocomplete="username" required>
                    </div>

                    <div class="field">
                        <span>🔒</span>
                        <input type="password" name="password" placeholder="Password"
                               autocomplete="current-password" required>
                    </div>

                    <div class="login-row">
                        <button type="submit">Login</button>
                    </div>
                </form>
            </div>

            <a class="forgot" href="forgotPassword.php">⬅ I forgot my password</a>
        </section>
    </main>

    <script>
        const params  = new URLSearchParams(window.location.search);
        const message = params.get("message");
        const type    = params.get("type") || "error"; // "error" | "success"
        const box     = document.getElementById("loginMessage");

        if (message) {
            box.textContent = decodeURIComponent(message);
            box.classList.add("show", type);
        }

        // Remove query string from address bar without reloading
        if (window.history.replaceState && (params.has("message") || params.has("type"))) {
            window.history.replaceState({}, "", window.location.pathname);
        }
    </script>
</body>
</html>
